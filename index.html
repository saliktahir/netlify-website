<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Salik Tahir — Discover the Best AI Tools</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --bg: #0F1417;
      --bg-soft: #161C21;
      --card: #1B2227;
      --line: rgba(255,255,255,0.08);
      --text: #EDF1F3;
      --text-soft: #9BA7AD;
      --accent: #5EE6C1;
      --accent-2: #F2B84B;
      --radius: 10px;
      --maxw: 1140px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }


    h1,
    h2,
    h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin: 0;
      letter-spacing: -0.01em;
    }


    .wrap {
      max-width: var(--maxw);
      margin: 0 auto;
      padding: 0 32px;
    }


    @media (max-width: 640px) {
      .wrap {
        padding: 0 20px;
      }
    }


    a {
      color: inherit;
    }


    /* =========================
       NAVBAR
       ========================= */

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15,20,23,0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }


    nav .wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 70px;
    }


    .brand {
      font-family: 'Space Grotesk';
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .brand .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }


    .navlinks {
      display: flex;
      gap: 32px;
      font-size: 14px;
      color: var(--text-soft);
    }


    .navlinks a {
      text-decoration: none;
      transition: 0.2s;
    }


    .navlinks a:hover {
      color: var(--text);
    }


    .navcta {
      background: var(--accent);
      color: #0F1417;
      padding: 9px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }


    @media (max-width: 720px) {
      .navlinks {
        display: none;
      }
    }


    /* =========================
       HERO
       ========================= */

    .hero {
      padding: 80px 0 60px;
      text-align: center;
    }


    .hero .kicker {
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }


    .hero h1 {
      font-size: 52px;
      line-height: 1.1;
      max-width: 780px;
      margin: 0 auto;
    }


    @media (max-width: 640px) {
      .hero h1 {
        font-size: 34px;
      }
    }


    .hero p {
      color: var(--text-soft);
      font-size: 17px;
      max-width: 560px;
      margin: 22px auto 0;
      line-height: 1.6;
    }


    .hero-cta {
      margin-top: 32px;
      display: flex;
      gap: 14px;
      justify-content: center;
      flex-wrap: wrap;
    }


    .btn {
      padding: 13px 26px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
    }


    .btn-primary {
      background: var(--accent);
      color: #0F1417;
    }


    .btn-outline {
      border: 1px solid var(--line);
      color: var(--text);
    }


    /* =========================
       GENERAL SECTIONS
       ========================= */

    section {
      padding: 70px 0;
    }


    .section-head {
      text-align: center;
      max-width: 560px;
      margin: 0 auto 48px;
    }


    .section-head h2 {
      font-size: 32px;
    }


    .section-head p {
      color: var(--text-soft);
      margin-top: 12px;
      font-size: 15px;
    }


    /* =========================
       ABOUT CARDS
       ========================= */

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }


    @media (max-width: 860px) {
      .tool-grid {
        grid-template-columns: 1fr 1fr;
      }
    }


    @media (max-width: 600px) {
      .tool-grid {
        grid-template-columns: 1fr;
      }
    }


    .tool-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px;
      transition: transform .15s ease, border-color .15s ease;
    }


    .tool-card:hover {
      transform: translateY(-3px);
      border-color: rgba(94,230,193,0.4);
    }


    .tool-icon {
      width: 42px;
      height: 42px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
    }


    .tool-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }


    .tool-card p {
      color: var(--text-soft);
      font-size: 14px;
      line-height: 1.55;
      margin: 0 0 14px;
    }


    .tool-tag {
      display: inline-block;
      font-size: 12px;
      color: var(--accent);
      border: 1px solid rgba(94,230,193,0.3);
      padding: 3px 10px;
      border-radius: 20px;
    }


    /* =========================
       WEBSITE PACKAGES
       ========================= */

    .pricing-section {
      padding: 80px 0;
    }


    .pricing-head {
      text-align: center;
      max-width: 600px;
      margin: 0 auto 48px;
    }


    .pricing-head h2
