
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Social Login Interface</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-container {
    width: 100%;
    max-width: 550px;
    padding: 35px 28px;
}

h3 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 25px;
    color: #111;
}

input {
    width: 100%;
    height: 61px;
    border: 1px solid #ccd0d5;
    border-radius: 17px;
    padding: 0 16px;
    font-size: 16px;
    margin-bottom: 12px;
    outline: none;
}

input:focus {
    border-color: #0866ff;
}

.login-btn {
    width: 100%;
    height: 44px;
    background: #0866e8;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 11px;
    cursor: pointer;
}

.forgot {
    display: block;
    text-align: center;
    margin-top: 24px;
    color: #111;
    text-decoration: none;
    font-size: 16px;
}

.divider {
    height: 55px;
}

.create-btn {
    width: 100%;
    height: 45px;
    background: white;
    border: 1px solid #0866ff;
    color: #0866ff;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.message {
    text-align: center;
    color: #333;
    font-size: 14px;
    margin-top: 20px;
}

@media(max-width: 600px) {
    .login-container {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <h3>Log into Social App Demo</h3>

    <form id="loginForm">

        <input
            type="text"
            placeholder="Email or mobile number"
            required
        >

        <input
            type="password"
            placeholder="Password"
            required
        >

        <button class="login-btn" type="submit">
            Log in
        </button>

    </form>

    <a href="#" class="forgot" id="forgot">
        Forgot password?
    </a>

    <div class="divider"></div>

    <button class="create-btn" id="create">
        Create new account
    </button>

    <p class="message" id="message">
        Demo interface — no credentials are collected.
    </p>

</div>

<script>
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

form.addEventListener("submit", function(e) {
    e.preventDefault();

    message.textContent =
    "Demo only: Login functionality is not connected.";
    
    form.reset();
});

document.getElementById("forgot").addEventListener("click",
function(e) {
    e.preventDefault();
    message.textContent =
    "Password recovery is not available in this demo.";
});

document.getElementById("create").addEventListener("click",
function() {
    message.textContent =
    "Account creation is not connected in this demo.";
});
</script>

</body>
</html>
